</style></head><body><main><header><small>AWB-01 // PRIVATE RESIDENTIAL</small><h1>THE PENTHOUSE</h1><p>A little model above the Afterweb.<br>Warm light for resting. Cold light for making things.</p></header>
<section class="model" id="model"><div class="sky"><div class="city"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="shelf"><div class="books"><b></b><b></b><b></b><b></b><b></b></div><div class="books s2"><b></b><b></b><b></b><b></b><b></b></div><div class="books s3"><b></b><b></b><b></b><b></b><b></b></div></div><button class="secret" id="secretBook" aria-label="Discover the hidden book" title="A book is waiting"></button><div class="living"><div class="lamp"></div><div class="sofa"></div><div class="cushion"></div></div><div class="lab"><h2>MINI LAB // COOL LIGHT</h2><div class="monitor"></div><div class="desk"></div></div><div class="switchbox"><small>LIVING / WARM</small><button class="switch" id="switch" aria-label="Switch lighting" aria-pressed="false"></button><small>LAB / COOL</small></div><div class="floor"></div></section>
<div class="controls"><button id="windowBtn">OPEN WINDOW</button><button id="bookBtn">INSPECT BOOK</button><button id="resetBtn">RESET MODEL</button></div><div id="status">MODEL READY // WARM LIGHT</div><div class="bookmodal" id="modal"><article><button class="close" id="close">CLOSE</button><h2 id="title"></h2><p id="text"></p></article></div><footer><a href="afterweb-building.html">← Afterweb Building</a> · <a href="index.html">Lobby</a><br>AFTERWEB BUILDING // PENTHOUSE</footer></main><script>
const model=document.getElementById('model'),sw=document.getElementById('switch'),status=document.getElementById('status'),modal=document.getElementById('modal'),win=document.querySelector('.sky');
sw.onclick=()=>{const cool=model.classList.toggle('cool');sw.setAttribute('aria-pressed',cool);status.textContent=cool?'MODEL MODE // COOL LAB LIGHT':'MODEL MODE // WARM LIVING LIGHT'};
document.getElementById('windowBtn').onclick=()=>{win.classList.toggle('open');win.style.transform=win.classList.contains('open')?'perspective(500px) rotateY(-8deg) scale(1.03)':'none';win.style.boxShadow=win.classList.contains('open')?'inset 0 0 40px #83e4ff55,0 0 30px #83e4ff55':'inset 0 0 24px #0009';status.textContent=win.classList.contains('open')?'WINDOW OPEN // DISTRICT SIGNALS VISIBLE':'WINDOW CLOSED // NIGHT VIEW'};
const secretTitle='The Map Blinked First',secretText='Some maps are not made to show where things are. They are made to remember who found the door. The building keeps its lights for visitors, and the window stays open for the ones who arrive by accident.';
function openBook(){document.getElementById('title').textContent=secretTitle;document.getElementById('text').textContent=secretText;modal.classList.add('open');status.textContent='BOOK OPEN // LORE SIGNAL FOUND'}
document.getElementById('secretBook').onclick=openBook;document.getElementById('bookBtn').onclick=openBook;document.getElementById('close').onclick=()=>modal.classList.remove('open');
document.getElementById('resetBtn').onclick=()=>{model.className='model';sw.setAttribute('aria-pressed','false');win.classList.remove('open');win.style.transform='none';win.style.boxShadow='';modal.classList.remove('open');status.textContent='MODEL RESET // WARM LIGHT'};
</script></body></html>
