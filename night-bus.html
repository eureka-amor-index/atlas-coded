</style></head><body><div class="wrap"><div class="top"><span>AFTERWEB BUILDING // AWB-01</span><a href="afterweb-building.html">← BACK TO THE BUILDING</a></div><header class="intro"><h1>NIGHT BUS</h1><p>Route 00. The last bus makes every stop, including the ones off-map.</p></header><main class="scene"><div class="bus-scene"><div class="skyline"></div><div class="route">ROUTE 00 // NIGHT SERVICE</div><div class="bus"><div class="buswin"><i></i><i></i><i></i><i></i></div><b>NIGHT BUS</b><div class="wheel w1"></div><div class="wheel w2"></div></div><div class="road"><div class="dash"></div></div><div class="stop">STOP <strong id="num">01</strong><span id="stop">DREAM AVENUE</span></div></div></main><section class="actions"><button id="next">NEXT STOP</button><p id="message">The driver doesn't ask where you're going.</p></section><footer class="footer"><a href="afterweb-building.html">← BACK TO THE BUILDING</a><p>THE AFTERWEB IS STILL OPEN.</p></footer></div><script>const stops=[['DREAM AVENUE','Windows glow with dreams nobody has to explain.'],['OLD INTERNET SQUARE','A dial-up tone drifts from a payphone.'],['MOON MARKET','Someone sells bottled starlight.'],['404 CROSSING','This stop was not found, but the bus waits.'],['SOFT STATIC','The city fades into distant rain.'],['HOME (OPTIONAL)','You can get off here. Or keep riding.']];let n=0;document.getElementById('next').onclick=()=>{n=(n+1)%stops.length;document.getElementById('num').textContent=String(n+1).padStart(2,'0');document.getElementById('stop').textContent=stops[n][0];document.getElementById('message').textContent=stops[n][1];const b=document.querySelector('.bus');b.classList.add('move');setTimeout(()=>b.classList.remove('move'),700);};</script></body></html>
