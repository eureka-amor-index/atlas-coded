</style></head><body><div class="wrap"><div class="top"><span>AFTERWEB BUILDING // AWB-01</span><a href="afterweb-building.html">← BACK TO THE BUILDING</a></div><header class="intro"><h1>TAPE GARDEN</h1><p>Magnetic memories growing quietly wild.</p></header><main class="scene"><div class="garden"><div class="soil"></div><div class="plant p1"><span>▣</span><i></i><b></b></div><div class="plant p2"><span>▣</span><i></i><b></b></div><div class="plant p3"><span>▣</span><i></i><b></b></div><div class="stars">✧ · ✦ · ✧</div></div></main><section class="actions"><button id="water">WATER THE GARDEN</button><p id="message">The tapes are sleeping beneath the leaves.</p><div class="count" id="count">GROWTH: 00</div></section><footer class="footer"><a href="afterweb-building.html">← BACK TO THE BUILDING</a><p>THE AFTERWEB IS STILL OPEN.</p></footer></div><script>let n=0;const phrases=['A tiny melody pushes through the soil.','The garden remembers rain on a roof.','A green note, a soft rewind.','New leaves unfold around an old chorus.','The tapes are warm in the afternoon sun.'];document.getElementById('water').onclick=()=>{n++;document.getElementById('count').textContent='GROWTH: '+String(n).padStart(2,'0');document.getElementById('message').textContent=phrases[(n-1)%phrases.length];document.querySelectorAll('.plant').forEach((p,i)=>p.style.transform='translateY('+(-Math.min(n,8)*4-i*2)+'px)');};</script></body></html>
