eb Building"}}</script><style>

.cabinet{padding:24px;background:#101a1a;border:1px solid #3b5551;box-shadow:0 0 45px #0008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drawer{height:110px;border:1px solid #536d64;background:linear-gradient(#253432,#131c1b);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;color:#91bcae;cursor:pointer}.drawer small{font-size:.58rem;letter-spacing:.15em;margin-top:9px;color:#829e91}.drawer:hover,.drawer.active{border-color:#c4e1d2;box-shadow:0 0 20px #91bcae44;background:#344e47}.story{min-height:72px;margin-top:20px;padding:15px;border:1px dashed #47635a;color:#9ab7a8;line-height:1.6}

</style></head><body><div class="wrap"><div class="top"><span>AFTERWEB BUILDING // AWB-01</span><a href="afterweb-building.html">← BACK TO THE BUILDING</a></div><header class="intro"><h1>LOST & FOUND</h1><p>Unclaimed objects. Unclaimed stories. A little drawer of almosts.</p></header><main class="scene"><div class="cabinet"><div class="grid"><button class="drawer" data-id="0">○<small>BUTTON</small></button><button class="drawer" data-id="1">⌁<small>KEY</small></button><button class="drawer" data-id="2">▧<small>MAP</small></button><button class="drawer" data-id="3">▤<small>TICKET</small></button><button class="drawer" data-id="4">◖<small>SHELL</small></button><button class="drawer" data-id="5">✉<small>NOTE</small></button></div><div class="story" id="story">Choose a drawer. Nothing is urgent.</div></div></main><section class="actions"><button id="close">CLOSE ALL DRAWERS</button><p id="message">Nothing is urgent.</p></section><footer class="footer"><a href="afterweb-building.html">← BACK TO THE BUILDING</a><p>THE AFTERWEB IS STILL OPEN.</p></footer></div><script>const stories=['A button from a coat that has traveled farther than its owner.','A key that fits no lock here. It is kept anyway.','A map with the destination gently rubbed away.','A ticket for a journey that never needed to happen.','A shell from an ocean nobody can locate on the network.','A folded note. The paper is blank, but warm.'];document.querySelectorAll('.drawer').forEach(b=>b.onclick=()=>{document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('story').textContent=stories[+b.dataset.id];document.getElementById('message').textContent='Item recovered: '+b.textContent.trim().replace(/\s+/g,' ');});document.getElementById('close').onclick=()=>{document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('active'));document.getElementById('story').textContent='The drawers are closed. Everything is still safe.';document.getElementById('message').textContent='Nothing is urgent.';};</script></body></html>
