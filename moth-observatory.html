</style></head><body><div class="wrap"><div class="top"><span>AFTERWEB BUILDING // AWB-01</span><a href="afterweb-building.html">← BACK TO THE BUILDING</a></div><header class="intro"><h1>MOTH OBSERVATORY</h1><p>A tiny astronomy station for things that orbit the light.</p></header><main class="scene"><div class="sky"><div class="moon"></div><div class="planet">MOTH<br>01</div><i class="star s1">✦</i><i class="star s2">✧</i><i class="star s3">✦</i><i class="star s4">✧</i><div class="orbit o1"></div><div class="orbit o2"></div></div></main><section class="actions"><button id="toggle">DRAW A CONSTELLATION</button><p id="message">The moths have their own constellations tonight.</p></section><footer class="footer"><a href="afterweb-building.html">← BACK TO THE BUILDING</a><p>THE AFTERWEB IS STILL OPEN.</p></footer></div><script>let i=0;const lines=['Three small lights. A shape only they recognize.','This constellation is called Almost Home.','A star map for creatures that mistake lamps for moons.','Tonight, the sky has room for soft things.'];document.getElementById('toggle').onclick=()=>{document.querySelector('.sky').classList.toggle('mapped');document.getElementById('message').textContent=lines[i++%lines.length];};</script></body></html>
