<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png" />    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 404</title>

<style>
body{
    margin:0;
    background:#f3f3f3;
    color:#111;
    font-family:"Courier New", monospace;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:100vh;
}

.room{
    text-align:center;
}

h1{
    font-size:5rem;
    margin:0;
}

p{
    color:#555;
}

.filing-cabinet{
    position:fixed;
    bottom:30px;
    right:30px;

    font-size:4rem;
    text-decoration:none;

    opacity:.25;

    transition:.3s;
}

.filing-cabinet:hover{
    opacity:1;
    transform:translateY(-4px);
}

.tooltip{
    position:absolute;
    bottom:90px;
    right:0;

    background:white;
    border:1px solid #000;

    padding:4px 8px;

    font-size:.75rem;

    display:none;
}

.filing-cabinet:hover .tooltip{
    display:block;
}
</style>
</head>

<body>

<div class="room">
    <h1>404</h1>

    <p>This room could not be found.</p>

    <p>Or perhaps it was filed elsewhere.</p>
</div>

<a class="filing-cabinet" href="lost-found-department.html">

🗄️

<span class="tooltip">
Property Records
</span>

</a>

</body>
</html>
